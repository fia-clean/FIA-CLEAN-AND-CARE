<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Logo Graphics -->
  <g filter="url(#shadow)" transform="translate(256, 210)">
    <!-- Shield / Clean Bottle Graphic -->
    <path d="M-90,-80 C-90,-80 0,-120 90,-80 C90,-30 80,70 0,130 C-80,70 -90,-30 -90,-80 Z" fill="url(#accent)" opacity="0.9" />
    
    <!-- Sparkle Stars -->
    <path d="M0,-60 L8,-40 L28,-40 L12,-26 L18,-6 L0,-20 L-18,-6 L-12,-26 L-28,-40 L-8,-40 Z" fill="#ffffff" />
    <circle cx="-45" cy="-20" r="7" fill="#a7f3d0" />
    <circle cx="50" cy="10" r="10" fill="#a7f3d0" />
    <circle cx="35" cy="-40" r="5" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="256" y="385" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">FIA</text>
  <text x="256" y="425" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="4">CLEAN &amp; CARE</text>
</svg>
